name: campus_care_app
description: "A campus care and student services mobile application."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2
  image_picker: ^1.1.2
  cloudinary_public: ^0.23.1
  shared_preferences: ^2.5.5
  google_sign_in: ^6.2.2
  get: ^4.7.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^17.2.2
  provider: ^6.1.5
  intl: ^0.20.2
  flutter_animate: ^4.5.2
  connectivity_plus: ^7.3.1
  skeletonizer: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
